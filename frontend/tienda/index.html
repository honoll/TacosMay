<!doctype html>
<html lang="es-MX" class="en-tienda">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Los Tacos May — Tienda</title>
  <link rel="icon" type="image/svg+xml" href="/marca/logo/icono.svg">
  <link rel="preload" href="/fuentes/barlow-condensed-800-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fuentes/barlow-condensed-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fuentes/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fuentes/barlow-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script type="speculationrules">{"prefetch": [{"where": {"and": [{"href_matches": "/*"}, {"not": {"href_matches": "/marca/*"}}]}, "eagerness": "moderate"}]}</script>
  <link rel="prefetch" href="/">
  <!-- Las mismas tres hojas, en el mismo orden, en todas las páginas: al pasar de una a otra sin
       recargar (js/paginas.js) nunca se enciende ni se apaga una hoja. Cada hoja de página tiene sus
       reglas acotadas a su página con :where(.en-inicio) o :where(.en-tienda), la clase de <html>. -->
  <link rel="stylesheet" href="/barra.css">
  <link rel="stylesheet" href="/landing.css">
  <link rel="stylesheet" href="/tienda/styles.css">
</head>
<body>
  <header class="cabecera caja">
    <a class="logo" href="/" aria-label="Los Tacos May, inicio"><img src="/marca/logo/compacta.svg" alt="" width="480" height="186"></a>
    <div class="cabecera-enlaces">
      <nav class="nav-principal" id="nav-principal" aria-label="Principal">
        <a href="/">Inicio</a>
        <a href="/tienda/#catalogo">Guisos</a>
        <a href="/#como">Cómo funciona</a>
        <a href="/#taqueria">La taquería</a>
      </nav>
      <nav class="nav-cuenta" id="nav" aria-label="Tu cuenta">
        <a href="/tienda/#entrar">Entrar</a>
      </nav>
    </div>
    <a class="btn chico carrito" id="nav-carrito" href="/tienda/#carrito">Carrito <b id="nav-carrito-n">0</b><span class="sr"> guisos</span><span data-countdown></span></a>
  </header>
  <script>
    /* Antes del primer cuadro: la cuenta y el carrito como estaban en la página anterior (los guarda
       js/cabecera.js), para que la cabecera no cambie al llegar. Luego el JS los confirma con la API. */
    try {
      var c = JSON.parse(sessionStorage.getItem('tm_cabecera'));
      if (c && localStorage.getItem('tm_sesion')) {
        document.getElementById('nav').innerHTML = c.nav;
        document.getElementById('nav-carrito-n').textContent = c.n;
        var s = Math.ceil((c.fin - Date.now()) / 1000);
        if (s > 0) document.querySelector('.carrito [data-countdown]').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      }
    } catch (e) {}
  </script>
  <p id="aviso" role="status" hidden></p>
  <main id="vista" class="caja" tabindex="-1"></main>
  <!-- Esqueleto del catálogo: lo usa app.js mientras responde la API y, al llegar al catálogo, ya está
       puesto desde el primer cuadro en vez de una vista vacía. -->
  <template id="esqueleto">
    <h1>Guisos de taquería empacados al vacío</h1>
    <ul class="barra" aria-busy="true" aria-label="Cargando los guisos"><li class="charola hueca"><div class="guiso"></div><div class="datos"><p></p><p></p></div></li><li class="charola hueca"><div class="guiso"></div><div class="datos"><p></p><p></p></div></li><li class="charola hueca"><div class="guiso"></div><div class="datos"><p></p><p></p></div></li><li class="charola hueca"><div class="guiso"></div><div class="datos"><p></p><p></p></div></li><li class="charola hueca"><div class="guiso"></div><div class="datos"><p></p><p></p></div></li><li class="charola hueca"><div class="guiso"></div><div class="datos"><p></p><p></p></div></li><li class="charola hueca"><div class="guiso"></div><div class="datos"><p></p><p></p></div></li><li class="charola hueca"><div class="guiso"></div><div class="datos"><p></p><p></p></div></li></ul>
  </template>
  <script>
    if (/^(#catalogo)?$/.test(location.hash)) document.getElementById('vista').innerHTML = document.getElementById('esqueleto').innerHTML;
  </script>
  <!-- El carrito como panel lateral: se abre desde el catálogo y la ficha, sin salir de ellos (app.js lo llena) -->
  <dialog class="panel" id="panel-carrito" aria-labelledby="panel-titulo"></dialog>
  <footer class="pie">
    <div class="caja pie-rejilla">
      <div>
        <img class="logo-pie" src="/marca/logo/principal-blanco.svg" alt="Los Tacos May" width="480" height="214" loading="lazy">
        <address><a href="https://www.google.com/maps/search/?api=1&amp;query=Los+Tacos+May%2C+Jos%C3%A9+Mar%C3%ADa+Morelos%2C+Centro%2C+Cabo+San+Lucas" rel="noopener">José María Morelos S/N, Local 3, Centro, 23450 Cabo San Lucas, B.C.S.</a></address>
      </div>
      <nav aria-label="Pie de página">
        <a href="/">Inicio</a>
        <a href="/tienda/#catalogo">Guisos</a>
        <a href="/#como">Cómo funciona</a>
        <a href="/#taqueria">La taquería</a>
        <a href="/tienda/#carrito">Carrito</a>
        <a href="/tienda/#entrar">Entrar</a>
        <a href="/tienda/#ayuda">Envíos y preguntas</a>
      </nav>
      <p class="pie-nota">Los guisos empacados y sus precios son de ejemplo mientras se confirma la carta real.</p>
      <!-- PENDIENTE-CLIENTE: contactos reales (teléfono, WhatsApp, correo, redes) como enlaces tel: / wa.me / mailto:, razón social y aviso de privacidad -->
    </div>
  </footer>
  <script type="module" src="/js/paginas.js"></script>
  <script type="module" src="/tienda/app.js"></script>
</body>
</html>
